[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
eth_rpc_url = "${RPC_URL}"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
default = "${RPC_URL}"

# Verification endpoint is passed on the command line
# (--verifier / --verifier-url / --etherscan-api-key) so the same config works
# for Blockscout and Etherscan. To pin it here instead, add e.g.:
# [etherscan]
# mychain = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer/api", chain = 968 }
